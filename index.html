<style>

.bingo-line-cell { animation: shimmer 2s ease-in-out infinite; }
</style>

function checkBingo(s){const ok=c=>s.has(cellTaskEn(c)),lines=[];for(let r=0;r<5;r++)if(BINGO_GRID[r].every(ok))lines.push(`row-${r}`);for(let c=0;c<5;c++)if(BINGO_GRID.every(row=>ok(row[c])))lines.push(`col-${c}`);if([0,1,2,3,4].every(i=>ok(BINGO_GRID[i][i])))lines.push("diag-tl");if([0,1,2,3,4].every(i=>ok(BINGO_GRID[i][4-i])))lines.push("diag-tr");return lines;}
function isBingoCell(cell,lines){const ci=["B","I","N","G","O"].indexOf(cell.col),r=cell.row-1;return lines.includes(`row-${r}`)||lines.includes(`col-${ci}`)||(lines.includes("diag-tl")&&ci===r)||(lines.includes("diag-tr")&&ci===4-r);}
function getLeaderboard(){return Object.entries(SUBMISSION_DATA).map(([club,tasks])=>{const completed=new Set(tasks),bingoLines=checkBingo(completed),gridMatches=ALL_CELLS.filter(c=>completed.has(cellTaskEn(c))).length;return{club,gridMatches,bingoLines};}).sort((a,b)=>b.gridMatches-a.gridMatches||b.bingoLines.length-a.bingoLines.length);}
function renderStatic(){document.getElementById("txt-date").textContent=tFn("date");document.getElementById("txt-leaderboard").textContent=tFn("leaderboard");document.getElementById("btn-grid").textContent=tFn("gridBtn");document.getElementById("btn-progress").textContent=tFn("progressBtn");document.getElementById("club-count").textContent=T[lang].clubsCompeting(Object.keys(SUBMISSION_DATA).length);document.getElementById("bingo-legend").innerHTML=`<div class="legend-item"><div class="legend-swatch" style="background:#FFD700;border:2px solid #FFD700;"></div>${tFn("legendLine")}</div><div class="legend-item"><div class="legend-swatch" style="background:#4CAF8C;border:2px solid #4CAF8C;"></div>${tFn("legendDone")}</div><div class="legend-item"><div class="legend-swatch" style="background:transparent;border:2px solid #334155;"></div>${tFn("legendPending")}</div>`;}
function renderLeaderboard(){const lb=getLeaderboard(),list=document.getElementById("leaderboard-list");list.innerHTML="";lb.forEach(({club,gridMatches,bingoLines},idx)=>{const div=document.createElement("div");div.className="club-item"+(club===selectedClub?" active":"");div.onclick=()=>selectClub(club);const rc=idx===0?"rank-1":idx===1?"rank-2":idx===2?"rank-3":"rank-other";const pill=bingoLines.length>0?`<div class="bingo-pills"><div class="bingo-pill">🎉 ${bingoLines.length} BINGO${bingoLines.length>1?"S":""}</div></div>`:"";div.innerHTML=`<div class="rank-badge ${rc}">${idx+1}</div><div class="club-info"><div class="club-name-row"><div class="club-name-text">${shortName(club)}</div></div>${pill}<div class="progress-bar-wrap"><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(gridMatches/25)*100}%"></div></div><div class="progress-count">${gridMatches}/25</div></div></div>`;list.appendChild(div);});}
function renderClubHeader(){const completed=getCompleted(selectedClub),bingoLines=checkBingo(completed),gridMatches=ALL_CELLS.filter(c=>completed.has(cellTaskEn(c))).length;document.getElementById("selected-club-name").textContent=selectedClub;const bingoChip=bingoLines.length>0?`<div class="chip" style="background:rgba(255,215,0,0.13);border:1px solid rgba(255,215,0,0.4);color:#FFD700;font-weight:700;">${T[lang].bingoBadge(bingoLines.length)}</div>`:"";document.getElementById("club-chips").innerHTML=`<div class="chip" style="background:rgba(232,66,90,0.13);border:1px solid rgba(232,66,90,0.33);">${T[lang].gridTasksComplete(gridMatches)}</div><div class="chip" style="background:rgba(76,175,140,0.13);border:1px solid rgba(76,175,140,0.33);">${T[lang].submissions(completed.size)}</div>${bingoChip}`;const banner=document.getElementById("bingo-banner");if(bingoLines.length>0){banner.style.display="block";banner.innerHTML=`<div style="font-size:15px;">${T[lang].bingoHeader(bingoLines.length)}</div><div class="bingo-lines-detail">${bingoLines.map(l=>`<span class="bingo-line-tag">${T[lang].bingoLineLabel(l)}</span>`).join("")}</div>`;}else banner.style.display="none";}
function renderGrid(){const completed=getCompleted(selectedClub),bingoLines=checkBingo(completed),grid=document.getElementById("bingo-grid");grid.innerHTML="";ALL_CELLS.forEach(cell=>{const isDone=completed.has(cellTaskEn(cell)),isLine=isDone&&isBingoCell(cell,bingoLines),catColor=getCatColor(cell.category.en),dispCat=cellCatDisplay(cell),shortCat=dispCat.length>20?dispCat.substring(0,19)+"…":dispCat,div=document.createElement("div");div.className="bingo-cell"+(isLine?" bingo-line-cell":"");let bg,border,shadow;if(isLine){bg="linear-gradient(135deg,rgba(255,215,0,0.18),rgba(255,140,0,0.1))";border="2px solid rgba(255,215,0,0.7)";shadow="0 0 20px rgba(255,215,0,0.35)";}else if(isDone){bg=hexToRgba(catColor,0.1);border=`2px solid ${hexToRgba(catColor,0.45)}`;shadow=`0 0 8px ${hexToRgba(catColor,0.15)}`;}else{bg="rgba(255,255,255,0.03)";border="2px solid rgba(255,255,255,0.07)";shadow="none";}div.style.cssText=`background:${bg};border:${border};box-shadow:${shadow};`;div.innerHTML=`<div class="cell-check" style="background:${isLine?"#FFD700":isDone?catColor:"rgba(255,255,255,0.08)"};color:${isLine?"#000":isDone?"#fff":"transparent"};font-size:${isLine?"8px":"9px"};">${isLine?"★":isDone?"✓":""}</div><div class="cell-category" style="color:${isLine?"#FFD700":catColor};">${shortCat}</div><div class="cell-task" style="color:${isDone?"#f0f4f8":"#94a3b8"};font-weight:${isDone?"600":"normal"};">${cellTaskDisplay(cell)}</div>`;grid.appendChild(div);});}
function renderProgress(){const completed=getCompleted(selectedClub),bingoLines=checkBingo(completed),allTasks=ALL_CELLS.map(c=>({...c,done:completed.has(cellTaskEn(c)),isLine:completed.has(cellTaskEn(c))&&isBingoCell(c,bingoLines)})),doneTasks=allTasks.filter(t=>t.done),outstanding=allTasks.filter(t=>!t.done),gridEn=new Set(ALL_CELLS.map(c=>cellTaskEn(c))),extra=(SUBMISSION_DATA[selectedClub]||[]).filter(t=>!gridEn.has(t));document.getElementById("prog-done-title").textContent=T[lang].doneTitle(doneTasks.length);document.getElementById("prog-out-title").textContent=T[lang].outTitle(outstanding.length);const doneEl=document.getElementById("done-tasks");doneEl.innerHTML="";if(!doneTasks.length)doneEl.innerHTML=`<div class="empty-state">${tFn("noTasksYet")}</div>`;else doneTasks.forEach(c=>doneEl.appendChild(makeTaskCard(c,true)));if(extra.length){const l=document.createElement("div");l.className="extra-label";l.textContent=tFn("extraLabel");doneEl.appendChild(l);extra.forEach(t=>{const d=document.createElement("div");d.className="extra-task";d.textContent=t;doneEl.appendChild(d);});}const outEl=document.getElementById("outstanding-tasks");outEl.innerHTML="";if(!outstanding.length)outEl.innerHTML=`<div class="empty-state">${tFn("allDone")}</div>`;else outstanding.forEach(c=>outEl.appendChild(makeTaskCard(c,false)));}
function makeTaskCard(cell,done){const catColor=getCatColor(cell.category.en),isLine=done&&cell.isLine,div=document.createElement("div");div.className="task-card";if(isLine){div.style.background="rgba(255,215,0,0.07)";div.style.borderColor="rgba(255,215,0,0.3)";}else if(done){div.style.background=hexToRgba(catColor,0.07);div.style.borderColor=hexToRgba(catColor,0.27);}div.innerHTML=`<div class="task-bar" style="background:${isLine?"#FFD700":catColor};"></div><div style="flex:1;overflow:hidden;"><div class="task-name" style="color:${done?"#f0f4f8":"#94a3b8"};">${cellTaskDisplay(cell)}${isLine?'<span class="task-bingo-star">⭐</span>':""}</div><div class="task-meta" style="color:${isLine?"#FFD700":catColor};">${cellCatDisplay(cell)} · ${cell.col}${cell.row}</div></div>`;return div;}
function selectClub(club){selectedClub=club;renderAll();}
function switchView(v){currentView=v;document.getElementById("grid-view").style.display=v==="grid"?"block":"none";document.getElementById("progress-view").style.display=v==="progress"?"flex":"none";document.getElementById("btn-grid").classList.toggle("active",v==="grid");document.getElementById("btn-progress").classList.toggle("active",v==="progress");if(v==="progress")renderProgress();}
function setLang(l){lang=l;document.getElementById("lang-en").classList.toggle("active",l==="en");document.getElementById("lang-fr").classList.toggle("active",l==="fr");renderAll();}
function renderAll(){renderStatic();renderLeaderboard();renderClubHeader();renderGrid();if(currentView==="progress")renderProgress();}
renderAll();
</script>
</body>
</html>
